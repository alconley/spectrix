[project]
name = "spectrix-python"
version = "1.4.0"
description = "Python runtime dependencies embedded by Spectrix"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.2",
    "uproot",
]

[dependency-groups]
parity = [
    "lmfit==1.3.4",
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[tool.uv]
package = false
