[package]
name = "spectrix-fitting"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Alex Conley <imaconley1@gmail.com>"]
description = "Deterministic nonlinear least-squares fitting for spectroscopy"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ALConley/spectrix"
keywords = ["fitting", "spectroscopy", "least-squares", "gaussian"]
categories = ["science", "mathematics"]
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "!**/__pycache__/**",
    "!**/*.pyc",
    "README.md",
    "PERFORMANCE.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
levenberg-marquardt = { version = "0.15.0", features = ["minpack-compat"] }
nalgebra = "0.34.1"
statrs = "0.18.0"
serde = { version = "1.0.219", features = ["derive"], optional = true }

[dev-dependencies]
approx = "0.5.1"
serde_json = "1.0.140"

[[bench]]
name = "performance"
harness = false

[lints]
workspace = true
